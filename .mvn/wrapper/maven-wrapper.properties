# Maven Wrapper: fija la version de Maven usada por el proyecto.
# Tipo "only-script": no se versiona ningun .jar; el script descarga Maven
# a ~/.m2/wrapper/dists la primera vez que se ejecuta ./mvnw
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
