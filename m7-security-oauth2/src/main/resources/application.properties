spring.application.name=m7-security-oauth2
spring.jpa.open-in-view=false

# EJ 7.1 - Login social. Crear las credenciales en Google Cloud Console y en
# GitHub > Settings > Developer settings > OAuth Apps.
# Redirect URI: http://localhost:8080/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configurar-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configurar}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:configurar-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:configurar}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
# EJ 7.2 - Resource Server: valida los JWT emitidos por Keycloak (compose.yaml)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/atech}

# Correos que reciben ROLE_ADMIN al darse de alta
atech.seguridad.admins=admin@atech.es

logging.level.org.springframework.security=info
