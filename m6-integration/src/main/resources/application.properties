spring.application.name=m6-integration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# H2 en memoria con nombre fijo y consola web: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:reservas · usuario: sa · sin contraseña) para ver la tabla linea_pendiente
spring.datasource.url=jdbc:h2:mem:reservas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

atech.tarifas.url=http://localhost:${server.port:8080}/tarifas
# Buzones de ficheros (relativos al directorio del módulo con spring-boot:run; se crean solos)
atech.ficheros.entrada=buzon/entrada
atech.ficheros.salida=buzon/salida

logging.level.org.springframework.integration=info

# Swagger UI para enviar solicitudes a mano: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=com.atech.curso.m6.web
