name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los runners de GitHub tienen Docker: los tests con Testcontainers se ejecutan aquí
      - name: Compilar y probar
        run: ./mvnw -B -ntp verify
