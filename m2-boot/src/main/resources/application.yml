spring:
  application:
    name: m2-reservas
  profiles:
    default: dev
  # EJ 2.5 - Hilos virtuales (Java 21+): Tomcat, @Async, planificadores...
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  docker:
    compose:
      enabled: false

atech:
  reservas:
    salas: [Turing, Lovelace, Hopper]
    duracion-maxima: 4h
    hora-apertura: 8
    hora-cierre: 20
    notificaciones:
      habilitadas: false

# EJ 2.4 - Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, reservas
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    nombre: ${spring.application.name}
    cliente: Atech Advanced Solutions
