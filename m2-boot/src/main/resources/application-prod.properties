# EJ 2.2 - Perfil prod: PostgreSQL. Docker Compose arranca compose.yaml y crea la conexión
# automáticamente (ServiceConnection); en un entorno real se usarían variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USER:atech}
spring.datasource.password=${DB_PASSWORD:atech}
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-only
# En el módulo 3 se sustituye por migraciones Flyway + validate
spring.jpa.hibernate.ddl-auto=update

# EJ 2.3 - Logging estructurado (Boot 3.4+): ecs, logstash o gelf
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=prod
