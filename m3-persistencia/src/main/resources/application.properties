spring.application.name=m3-persistencia
spring.jpa.open-in-view=false
# El esquema lo gestiona Flyway; Hibernate sólo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.locations=classpath:db/migration

# EJ 3.7 - Probabilidad de cada escándalo en CADA nombramiento (se pueden cambiar en la consola, opción 12)
gobierno.escandalos.casoplon=0.03
gobierno.escandalos.cutre-master=0.02
gobierno.escandalos.joyas-ocultas=0.01
# Descomenta para que los nombres y los escándalos se repitan en cada arranque
#gobierno.semilla=42

# --m3.consola.activa=false para arrancar y terminar sin menú
m3.consola.activa=true

# Las trazas usan la misma codificación que System.out (la del terminal), para que los acentos
# del menú y del log se vean igual en Windows, Linux y el IDE
logging.charset.console=${stdout.encoding:UTF-8}
# Formato corto para que la consola interactiva se lea bien entre las trazas
logging.pattern.console=%clr(%5p) %clr(%-22.22logger{0}){cyan} : %m%n%wEx
logging.level.org.hibernate.SQL=debug
# Descomenta (u opción 15 de la consola) para ver abrir, confirmar y deshacer transacciones
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug

#---
# docker compose up -d  &&  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.config.activate.on-profile=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas
spring.datasource.username=atech
spring.datasource.password=atech
