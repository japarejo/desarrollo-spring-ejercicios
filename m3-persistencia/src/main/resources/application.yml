spring:
  application:
    name: m3-persistencia
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate sólo lo valida
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

# EJ 3.7 - Probabilidad de cada escándalo en CADA nombramiento (se pueden cambiar en la consola, opción 12)
gobierno:
  escandalos:
    casoplon: 0.03
    cutre-master: 0.02
    joyas-ocultas: 0.01
  # semilla: 42   # descomenta para que los nombres y los escándalos se repitan en cada arranque

m3:
  consola:
    activa: true   # --m3.consola.activa=false para arrancar y terminar sin menú

logging:
  # Las trazas usan la misma codificación que System.out (la del terminal), para que los acentos
  # del menú y del log se vean igual en Windows, Linux y el IDE
  charset:
    console: ${stdout.encoding:UTF-8}
  # Formato corto para que la consola interactiva se lea bien entre las trazas
  pattern:
    console: "%clr(%5p) %clr(%-22.22logger{0}){cyan} : %m%n%wEx"
  level:
    org.hibernate.SQL: debug
    # Descomenta (u opción 15 de la consola) para ver abrir, confirmar y deshacer transacciones
    # org.springframework.orm.jpa.JpaTransactionManager: debug

---
# docker compose up -d  &&  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/reservas
    username: atech
    password: atech
